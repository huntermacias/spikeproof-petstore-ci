# Spikeproof load test: "Parallel Requests" on Perf (perf).
# Generated by Spikeproof 0.1.0-beta.4. Package perf/parallel-requests.spikeproof.json (sha256:20815e97dd8c210f10264e5f4bdc633ddee838ae1b4a03c920864be949a02d72).
# Exit codes: 0 passed · 1 a goal or journey check failed · 2 invalid input (fix the package or the command) · 3 blocked by policy (ask your Spikeproof administrator) · 4 could not run (k6, network or agent problem).
name: "Spikeproof · Parallel Requests (perf)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikeproof-parallel-requests-perf
  cancel-in-progress: false

jobs:
  load-test:
    name: Parallel Requests · Perf
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      SPIKEPROOF_VERSION: "0.1.0-beta.4"
      SPIKEPROOF_CLI_SHA256: "e6102d58fcc381057dbd000dcafc20b55eaa2e60bbbfa52ed2544fd406d6d2dc"
      K6_VERSION: "1.6.1"
      SPIKEPROOF_PACKAGE: perf/parallel-requests.spikeproof.json
      SPIKEPROOF_ENV: perf
      SPIKEPROOF_RESULTS: spikeproof-results
    steps:
      - name: Check out the test package
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install k6 and the Spikeproof CLI (pinned, checksum-verified)
        run: |
          SPIKEPROOF_TOOLS="$RUNNER_TEMP/spikeproof"
          echo "SPIKEPROOF_TOOLS=$SPIKEPROOF_TOOLS" >> "$GITHUB_ENV"
          echo "SPIKEPROOF_K6_EXECUTABLE=$SPIKEPROOF_TOOLS/bin/k6" >> "$GITHUB_ENV"
          set -euo pipefail
          fail() { echo "spikeproof setup: $*" >&2; exit 4; }
          verify() { # verify <sha256> <file>
            if command -v sha256sum >/dev/null 2>&1; then echo "$1  $2" | sha256sum -c --status - || fail "checksum mismatch for $2: refusing to use it"
            else echo "$1  $2" | shasum -a 256 -c --status - || fail "checksum mismatch for $2: refusing to use it"; fi
          }
          mkdir -p "$SPIKEPROOF_TOOLS/bin"
          command -v node >/dev/null 2>&1 || fail "Node.js 22 or newer is required on this agent"
          node -e 'process.exit(+process.versions.node.split(".")[0] >= 22 ? 0 : 1)' || fail "Node.js 22 or newer is required (found $(node --version))"
          command -v curl >/dev/null 2>&1 || fail "curl is required on this agent"

          # k6 $K6_VERSION, pinned to Grafana's published checksums
          [ "$K6_VERSION" = "1.6.1" ] || fail "this pipeline pins checksums for k6 1.6.1; regenerate it in Spikeproof to change versions"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64|Linux-amd64) k6_file=k6-v1.6.1-linux-amd64.tar.gz k6_sha=68df4958a1b089dc6f70a234e07c7ec818922f83b261ca24f3abf79882b13343 ;;
            Linux-aarch64|Linux-arm64) k6_file=k6-v1.6.1-linux-arm64.tar.gz k6_sha=698e47804a8cf679237dc7f19813e2967e0a892d4b9387f6f6de46da259069f9 ;;
            Darwin-x86_64) k6_file=k6-v1.6.1-macos-amd64.zip k6_sha=93d54398159c2cae1c5fecbb6c6abd5d12a8e43f181f2b246749b4320d08516e ;;
            Darwin-arm64) k6_file=k6-v1.6.1-macos-arm64.zip k6_sha=104c4b8f3784d2e1899b4f0b9d9197538d9657d9eb9a9631638a58b72b2e9434 ;;
            *) fail "no pinned k6 build for $(uname -s) $(uname -m); use a Linux or macOS agent" ;;
          esac
          if [ ! -x "$SPIKEPROOF_TOOLS/bin/k6" ]; then
            curl -fsSL --retry 3 -o "$SPIKEPROOF_TOOLS/$k6_file" "https://github.com/grafana/k6/releases/download/v$K6_VERSION/$k6_file" || fail "couldn't download k6 (does this agent reach github.com?)"
            verify "$k6_sha" "$SPIKEPROOF_TOOLS/$k6_file"
            case "$k6_file" in
              *.tar.gz) tar -xzf "$SPIKEPROOF_TOOLS/$k6_file" -C "$SPIKEPROOF_TOOLS" ;;
              *.zip) (cd "$SPIKEPROOF_TOOLS" && unzip -oq "$k6_file") ;;
            esac
            mv "$SPIKEPROOF_TOOLS/${k6_file%.tar.gz}/k6" "$SPIKEPROOF_TOOLS/bin/k6" 2>/dev/null || mv "$SPIKEPROOF_TOOLS/${k6_file%.zip}/k6" "$SPIKEPROOF_TOOLS/bin/k6"
          fi

          # Spikeproof CLI $SPIKEPROOF_VERSION: one JavaScript file from Spikeproof's public release
          cli_file="spikeproof-cli-$SPIKEPROOF_VERSION.mjs"
          # SPIKEPROOF_CLI_BASE_URL: an internal mirror holding the same files (agents without github.com access).
          cli_base="${SPIKEPROOF_CLI_BASE_URL:-https://github.com/huntermacias/spikeproof-releases/releases/download/v$SPIKEPROOF_VERSION}"
          curl -fsSL --retry 3 -o "$SPIKEPROOF_TOOLS/$cli_file" "$cli_base/$cli_file" || fail "couldn't download $cli_file from $cli_base (is v$SPIKEPROOF_VERSION published, and does this agent reach github.com?)"
          cli_sha="${SPIKEPROOF_CLI_SHA256:-}"
          if [ -z "$cli_sha" ]; then
            # No pinned sum: take it from the release's SHA256SUMS.txt (published releases can't be changed).
            curl -fsSL --retry 3 -o "$SPIKEPROOF_TOOLS/SHA256SUMS.txt" "$cli_base/SHA256SUMS.txt" || fail "couldn't download SHA256SUMS.txt for v$SPIKEPROOF_VERSION"
            cli_sha=$(awk -v f="$cli_file" '$2 == f { print $1 }' "$SPIKEPROOF_TOOLS/SHA256SUMS.txt")
            [ -n "$cli_sha" ] || fail "SHA256SUMS.txt for v$SPIKEPROOF_VERSION doesn't list $cli_file"
          fi
          verify "$cli_sha" "$SPIKEPROOF_TOOLS/$cli_file"
          cp "$SPIKEPROOF_TOOLS/$cli_file" "$SPIKEPROOF_TOOLS/spikeproof.mjs"
          node "$SPIKEPROOF_TOOLS/spikeproof.mjs" version
          "$SPIKEPROOF_TOOLS/bin/k6" version | head -n 1

      - name: Connection policy (organization variable SPIKEPROOF_POLICY)
        env:
          SPIKEPROOF_POLICY: ${{ vars.SPIKEPROOF_POLICY }}
        run: |
          if [ -z "$SPIKEPROOF_POLICY" ]; then
            echo "::error title=Spikeproof policy missing::Your administrator sets the SPIKEPROOF_POLICY variable (organization or repository) with the approved targets. Without it only localhost targets run."
            exit 3
          fi
          umask 077
          printf '%s' "$SPIKEPROOF_POLICY" > "$SPIKEPROOF_TOOLS/policy.json"
          echo "SPIKEPROOF_CONNECTION_POLICY=$SPIKEPROOF_TOOLS/policy.json" >> "$GITHUB_ENV"

      - name: Preflight (checks everything; sends nothing)
        run: node "$SPIKEPROOF_TOOLS/spikeproof.mjs" preflight "$SPIKEPROOF_PACKAGE" --env "$SPIKEPROOF_ENV" --output "$SPIKEPROOF_RESULTS"

      - name: Load test
        run: node "$SPIKEPROOF_TOOLS/spikeproof.mjs" run "$SPIKEPROOF_PACKAGE" --env "$SPIKEPROOF_ENV" --output "$SPIKEPROOF_RESULTS" --build "$GITHUB_SHA"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spikeproof-results-perf
          path: spikeproof-results/
          if-no-files-found: ignore
          retention-days: 30
